name: validate

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository sanity
        run: test -f README.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install contract validator
        run: npm install --ignore-scripts --no-package-lock
      - name: JSON Schema 2020-12 positive and adversarial fixtures
        run: npm run test:passport
      - name: Secret scan placeholder
        run: |
          ! grep -R "sk-" . --exclude-dir=.git --exclude='validate.yml' || exit 1
      - name: Claim boundary placeholder
        run: |
          ! grep -R "production ready" README.md docs 2>/dev/null || exit 1
